<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="max-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="max-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="max-m-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="max-m-right" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="max-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b4b" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.2" />
    </filter>
    <filter id="m-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Gradient & Shadow -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#max-bg)" filter="url(#max-shadow)" />

  <!-- Subtle Inner Glass/Light Highlight -->
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="url(#max-glow)" stroke-width="1.5" />

  <!-- Stylized Geometric "M" Monogram -->
  <g filter="url(#m-glow)">
    <!-- Left Pillar & Diagonal Down -->
    <path d="M 32 88 L 32 40 C 32 37.79 33.79 36 36 36 L 44 36 C 45.45 36 46.78 36.79 47.47 38.07 L 64 68.7 L 80.53 38.07 C 81.22 36.79 82.55 36 84 36 L 92 36 C 94.21 36 96 37.79 96 40 L 96 88 C 96 90.21 94.21 92 92 92 L 84 92 C 81.79 92 80 90.21 80 88 L 80 57.5 L 68.3 79.16 C 67.58 80.49 66.17 81.33 64.65 81.33 C 63.13 81.33 61.72 80.49 61 79.16 L 48 57.5 L 48 88 C 48 90.21 46.21 92 44 92 L 36 92 C 33.79 92 32 90.21 32 88 Z" fill="url(#max-m-left)" />
    <!-- Dynamic Accent Diamond / Vertex -->
    <polygon points="64,52 70,60 64,68 58,60" fill="#38bdf8" opacity="0.9" />
  </g>
</svg>